<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .status { padding: 10px; margin: 10px 0; border: 1px solid #0f0; }
        .error { border-color: #f00; color: #f00; }
        .success { border-color: #0f0; color: #0f0; }
        button { padding: 10px 20px; margin: 5px; background: #0f0; color: #000; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Landing Page Debug Tool</h1>
    
    <div class="status">
        <h2>Test Status</h2>
        <div id="status">Initializing...</div>
    </div>

    <div>
        <h2>Actions</h2>
        <button onclick="testLocalStorage()">Check LocalStorage (Auth Token)</button>
        <button onclick="clearAuth()">Clear Auth & Reload</button>
        <button onclick="testFetch()">Test API Connection</button>
        <button onclick="openIncognito()">Instructions for Incognito</button>
    </div>

    <div class="status">
        <h2>Debug Info</h2>
        <pre id="debug"></pre>
    </div>

    <script>
        const MINIKUBE_URL = 'http://192.168.49.2:30080';
        const LOCALHOST_URL = 'http://localhost:8080';

        function log(msg, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = isError ? 'error' : 'success';
            statusDiv.innerHTML += msg + '<br>';
        }

        function testLocalStorage() {
            const debug = document.getElementById('debug');
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            debug.innerHTML = `
Token: ${token || 'NOT FOUND (Good - should see Landing Page)'}
User: ${user || 'NOT FOUND (Good - should see Landing Page)'}

All localStorage keys:
${JSON.stringify(Object.keys(localStorage), null, 2)}

Full localStorage:
${JSON.stringify(localStorage, null, 2)}
            `;

            if (token) {
                log('⚠️ AUTH TOKEN FOUND! This is why you see Login instead of Landing Page!', true);
                log('Click "Clear Auth & Reload" button to fix.', true);
            } else {
                log('✅ No auth token - Landing Page should display');
            }
        }

        function clearAuth() {
            localStorage.clear();
            sessionStorage.clear();
            
            // Also clear all cookies
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });
            
            log('✅ Cleared localStorage, sessionStorage, and cookies');
            log('🔄 Reloading in 2 seconds...');
            
            setTimeout(() => {
                window.location.href = MINIKUBE_URL;
            }, 2000);
        }

        async function testFetch() {
            log('Testing connection to ' + MINIKUBE_URL);
            
            try {
                const response = await fetch(MINIKUBE_URL);
                const html = await response.text();
                
                log('✅ Connected successfully');
                log('Response length: ' + html.length + ' bytes');
                
                if (html.includes('index-eZHBBr2E.js')) {
                    log('✅ Latest build detected (v4.0.2)');
                } else {
                    log('⚠️ Old build detected - need to rebuild', true);
                }
                
                document.getElementById('debug').innerHTML = html.substring(0, 1000);
            } catch (error) {
                log('❌ Connection failed: ' + error.message, true);
            }
        }

        function openIncognito() {
            alert(`
🔐 HOW TO TEST IN INCOGNITO MODE:

Chrome/Edge:
  Cmd+Shift+N (Mac) or Ctrl+Shift+N (Windows)

Firefox:
  Cmd+Shift+P (Mac) or Ctrl+Shift+P (Windows)

Safari:
  Cmd+Shift+N

Then navigate to:
  ${MINIKUBE_URL}

This ensures ZERO cache interference!
            `);
        }

        // Auto-run on load
        window.onload = () => {
            log('🚀 Test tool loaded');
            testLocalStorage();
        };
    </script>
</body>
</html>
