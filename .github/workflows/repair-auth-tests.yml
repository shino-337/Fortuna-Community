name: repair-auth-tests

on:
  push:
    branches: [hardening/foundation-alignment]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/foundation-alignment

      - name: Restore and patch auth handler
        shell: bash
        run: |
          set -euo pipefail
          git show d5eb4db4e15b4e174b43b5a6c2734d96e166ab75:core/internal/api/auth_handlers.go > core/internal/api/auth_handlers.go
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/internal/api/auth_handlers.go')
          s = p.read_text()
          old = '''\t\t// Check if username already exists\n\t\tvar existingUser models.User\n\t\tif err := db.Where("username = ? OR email = ?", req.Username, req.Email).First(&existingUser).Error; err == nil {\n\t\t\tc.JSON(http.StatusConflict, gin.H{"error": "Username or email already exists"})\n\t\t\treturn\n\t\t}\n'''
          new = '''\t\t// Check if username or email already exists. ErrRecordNotFound is expected\n\t\t// for a new user; other database errors must fail the request.\n\t\tvar existingUser models.User\n\t\terr := db.Where("username = ? OR email = ?", req.Username, req.Email).First(&existingUser).Error\n\t\tswitch {\n\t\tcase err == nil:\n\t\t\tc.JSON(http.StatusConflict, gin.H{"error": "Username or email already exists"})\n\t\t\treturn\n\t\tcase errors.Is(err, gorm.ErrRecordNotFound):\n\t\t\t// No matching user; continue with registration.\n\t\tdefault:\n\t\t\tc.JSON(http.StatusInternalServerError, gin.H{"error": "failed to check existing user"})\n\t\t\treturn\n\t\t}\n'''
          if old not in s:
              raise SystemExit('registration lookup block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Stabilize SQLite lifecycle test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/internal/api/user_lifecycle_handlers_test.go')
          s = p.read_text()
          old = '''\tdb, err := gorm.Open(sqlite.Open(":memory:"), &gorm.Config{})\n\tif err != nil {\n\t\tt.Fatalf("sqlite: %v", err)\n\t}\n'''
          new = '''\tdb, err := gorm.Open(sqlite.Open(":memory:"), &gorm.Config{})\n\tif err != nil {\n\t\tt.Fatalf("sqlite: %v", err)\n\t}\n\tsqlDB, err := db.DB()\n\tif err != nil {\n\t\tt.Fatalf("sql db: %v", err)\n\t}\n\t// SQLite :memory: databases are connection-local. Keep one connection\n\t// so GORM tests cannot lose the migrated schema between operations.\n\tsqlDB.SetMaxOpenConns(1)\n\tsqlDB.SetMaxIdleConns(1)\n'''
          if old not in s:
              raise SystemExit('sqlite setup block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove temporary repair workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-auth-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/internal/api/auth_handlers.go core/internal/api/user_lifecycle_handlers_test.go .github/workflows/repair-auth-tests.yml
          git commit -m 'fix(core): handle registration lookup and stabilize sqlite tests'
          git push origin HEAD:hardening/foundation-alignment
