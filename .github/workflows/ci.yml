name: CI

# Validation gate for the supported repository toolchain.
# Keep this workflow intentionally small: product behavior remains the source of truth.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: |
            go.work
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Security regression contract
        if: matrix.module == 'core'
        run: |
          python3 scripts/verify/test-security-regression-gate.py
          python3 scripts/verify/check-security-regressions.py
      - name: Repeat SQLite risk engine regressions
        if: matrix.module == 'core'
        working-directory: core
        run: go test ./pkg/riskengine -run 'TestCreateOrUpdateInsight|TestAssetSecurityState|TestEnrichPodFortunaContext|TestYAMLEnginePodRuntimeCorrelationRules' -count=20 -timeout=2m
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  cluster-identity-postgres:
    name: Cluster identity PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortuna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortuna_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: |
            go.work
            core/go.mod
            core/go.sum
      - name: Verify populated cluster identity migration on PostgreSQL
        working-directory: core
        env:
          FORTUNA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/fortuna_test?sslmode=disable
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./migrations -run '^TestClusterResourceIdentityFoundationPostgres$' -count=1 -timeout=2m | tee /tmp/cluster-identity-postgres.log
          grep -q -- '--- PASS: TestClusterResourceIdentityFoundationPostgres' /tmp/cluster-identity-postgres.log

  dashboard:
    name: Dashboard validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck
      - name: Build
        working-directory: dashboard
        run: npm run build
      - name: Install Chromium for runtime evidence tests
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Runtime evidence error states
        working-directory: dashboard
        run: npx playwright test --config playwright.runtime.config.ts

  scripts:
    name: Shell script validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Service selectors
        run: |
          python -m pip install PyYAML==6.0.2
          python scripts/verify/check-service-selectors.py
          python scripts/e2e/test-webhook-bootstrap.py
      - name: Validate agent credential provisioning
        run: |
          python scripts/verify/test-agent-credential-tool.py
          python scripts/verify/test-scoped-agent-credential-overlay.py
      - name: Validate cluster resource identity model contract
        run: python scripts/verify/check-cluster-resource-models.py
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reject generated/local artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(node_modules|\\.venv|__pycache__|\\.DS_Store)(/|$)|\\.(pyc|pyo|tgz|zip|tar|tar\\.gz)$'
          if git ls-files -z | grep -zEq "$forbidden"; then
            echo 'Forbidden generated/local artifact tracked in repository.'
            git ls-files | grep -E "$forbidden" || true
            exit 1
          fi
