name: Build and publish images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish. Defaults to branch/tag derived value.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fortuna-core
            dockerfile: core/Dockerfile
          - image: fortuna-agent
            dockerfile: agent/Dockerfile
          - image: fortuna-dashboard
            dockerfile: dashboard/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image names
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          repo_lc="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(git rev-parse --short=12 HEAD)"
          if [ -n "${{ inputs.version || '' }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            version="latest"
          else
            version="pr-${{ github.event.pull_request.number || github.run_number }}"
          fi
          echo "image_prefix=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/${{ matrix.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image_prefix }}/${{ matrix.image }}:sha-${{ steps.vars.outputs.short_sha }}
          build-args: |
            FORTUNA_BUILD_VERSION=${{ steps.vars.outputs.version }}
            FORTUNA_BUILD_COMMIT=${{ github.sha }}
            FORTUNA_BUILD_TIME=${{ steps.vars.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
