# Build and test on push to main and on pull requests
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.24'

jobs:
  test-go:
    name: Test Go (Core & Agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            core/.cache
            agent/.cache
          key: ${{ runner.os }}-go-${{ hashFiles('core/go.sum', 'agent/go.sum', 'api/go.sum') }}

      - name: Test Core
        run: |
          cd core && go mod download && go test ./... -count=1
        continue-on-error: true

      - name: Test Agent
        run: |
          cd agent && go mod download && go test ./... -count=1
        continue-on-error: true

      # G-R10 Phase A: admission gate smoke (no-op without kubectl/cluster; prints env + webhook when present).
      - name: Verify admission risk gate (optional cluster)
        run: bash scripts/verify/verify-admission-risk-gate.sh

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-go]
    strategy:
      fail-fast: false
      matrix:
        component: [core, agent, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: fortuna-${{ matrix.component }}:build
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
