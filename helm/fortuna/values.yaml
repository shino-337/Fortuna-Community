# Fortuna Helm Chart – default values
# Override with -f custom.yaml or --set key=value

nameOverride: ""
fullnameOverride: ""

# Namespace (used in templates; prefer installing with -n fortuna)
namespaceOverride: "fortuna"

# Image settings (common)
image:
  registry: ""
  pullPolicy: IfNotPresent
  tag: "latest"

# Core
core:
  replicaCount: 1
  image:
    repository: fortuna-core
    # registry from global image.registry
  env:
    databaseUrl: "postgres://postgres:postgres@postgres.fortuna.svc.cluster.local:5432/fortuna?sslmode=disable"
    natsEndpoint: "nats://nats-client.fortuna.svc.cluster.local:4222"
    httpPort: "8080"
    grpcPort: "9090"
    tlsEnabled: "true"
    authEnabled: "true"
    pceSchedulerEnabled: "true"
    pceSchedulerInterval: "6h"
    logLevel: "info"
    fortunaEnableSeedData: "true"
    # Admin (override in production via secret)
    fortunaAdminUsername: "admin"
    fortunaAdminPassword: "admin123"
    fortunaAdminEmail: "admin@fortuna.local"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
  # Optional: use existing secret for JWT / admin (keys: jwt-secret, admin-password)
  existingSecret: ""

# Agent (CORE_GRPC/HTTP_ENDPOINT set from release namespace in template)
agent:
  image:
    repository: fortuna-agent
  env:
    syncInterval: "5m"
    heartbeatInterval: "15s"
    tlsEnabled: "true"
    containerdSocket: "/run/containerd/containerd.sock"
    containerdNamespace: "k8s.io"
    logLevel: "info"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

# Dashboard
dashboard:
  replicaCount: 1
  image:
    repository: fortuna-dashboard
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  nodeSelector: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# mTLS / Webhook secret names (must exist before install)
tls:
  coreSecretName: fortuna-core-tls
  agentSecretName: fortuna-agent-tls
  caSecretName: fortuna-ca-cert
  webhookSecretName: fortuna-webhook-tls
