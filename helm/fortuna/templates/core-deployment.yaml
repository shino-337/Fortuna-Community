apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortuna-core
  namespace: {{ include "fortuna.namespace" . }}
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
spec:
  replicas: {{ .Values.core.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fortuna
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortuna
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: fortuna-core
      nodeSelector:
        {{- toYaml .Values.core.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.core.tolerations | nindent 8 }}
      volumes:
        - name: fortuna-core-server-tls
          secret:
            secretName: {{ .Values.tls.coreSecretName }}
        - name: fortuna-ca-cert
          secret:
            secretName: {{ .Values.tls.caSecretName }}
        - name: webhook-certs
          secret:
            secretName: {{ .Values.tls.webhookSecretName }}
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
      containers:
        - name: core
          image: {{ include "fortuna.coreImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ .Values.core.env.databaseUrl | quote }}
            - name: NATS_ENDPOINT
              value: {{ .Values.core.env.natsEndpoint | quote }}
            - name: HTTP_PORT
              value: {{ .Values.core.env.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.core.env.grpcPort | quote }}
            - name: TLS_ENABLED
              value: {{ .Values.core.env.tlsEnabled | quote }}
            - name: TLS_CERT_PATH
              value: "/etc/fortuna/tls/server/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/fortuna/tls/server/tls.key"
            - name: TLS_CA_CERT_PATH
              value: "/etc/fortuna/ca-cert/ca.crt"
            - name: WEBHOOK_TLS_CERT_PATH
              value: "/etc/webhook/certs/tls.crt"
            - name: WEBHOOK_TLS_KEY_PATH
              value: "/etc/webhook/certs/tls.key"
            - name: LOG_LEVEL
              value: {{ .Values.core.env.logLevel | quote }}
            - name: FORTUNA_ENABLE_SEED_DATA
              value: {{ .Values.core.env.fortunaEnableSeedData | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.core.env.authEnabled | quote }}
            - name: FORTUNA_ADMIN_USERNAME
              value: {{ .Values.core.env.fortunaAdminUsername | quote }}
            - name: FORTUNA_ADMIN_PASSWORD
              value: {{ .Values.core.env.fortunaAdminPassword | quote }}
            - name: FORTUNA_ADMIN_EMAIL
              value: {{ .Values.core.env.fortunaAdminEmail | quote }}
            - name: PCE_SCHEDULER_ENABLED
              value: {{ .Values.core.env.pceSchedulerEnabled | quote }}
            - name: PCE_SCHEDULER_INTERVAL
              value: {{ .Values.core.env.pceSchedulerInterval | quote }}
            {{- if .Values.core.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.core.existingSecret }}
                  key: jwt-secret
                  optional: true
            {{- end }}
          volumeMounts:
            - name: fortuna-core-server-tls
              mountPath: /etc/fortuna/tls/server
              readOnly: true
            - name: fortuna-ca-cert
              mountPath: /etc/fortuna/ca-cert
              readOnly: true
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
