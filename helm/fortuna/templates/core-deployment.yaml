{{- if .Values.core.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.core.name }}
  namespace: {{ include "fortuna.namespace" . }}
  labels:
    {{- include "fortuna.core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.core.replicaCount }}
  selector:
    matchLabels:
      {{- include "fortuna.core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fortuna.core.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.rbac.serviceAccount.core.name }}
      {{- with .Values.core.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.core.tls.enabled }}
        - name: fortuna-core-server-tls
          secret:
            secretName: {{ .Values.core.tls.certSecret }}
        {{- end }}
      containers:
        - name: core
          image: "{{ .Values.core.image.repository }}:{{ .Values.core.image.tag }}"
          imagePullPolicy: {{ .Values.core.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.core.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.core.service.grpcPort }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ .Values.core.database.url | quote }}
            - name: NATS_ENDPOINT
              value: {{ .Values.core.nats.endpoint | quote }}
            - name: HTTP_PORT
              value: {{ .Values.core.service.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.core.service.grpcPort | quote }}
            {{- if .Values.core.tls.enabled }}
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_PATH
              value: {{ .Values.core.tls.certPath | quote }}
            - name: TLS_KEY_PATH
              value: {{ .Values.core.tls.keyPath | quote }}
            - name: TLS_CA_CERT_PATH
              value: {{ .Values.core.tls.caCertPath | quote }}
            {{- end }}
            {{- range $key, $value := .Values.core.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.core.tls.enabled }}
          volumeMounts:
            - name: fortuna-core-server-tls
              mountPath: /etc/fortuna/tls/server
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.core.securityContext | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.core.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.core.readinessProbe | nindent 12 }}
{{- end }}

