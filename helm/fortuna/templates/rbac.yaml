---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortuna-core
  namespace: {{ include "fortuna.namespace" . }}
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fortuna-core
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
rules:
  - apiGroups: [""]
    resources: [pods, services, namespaces, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fortuna-core
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fortuna-core
subjects:
  - kind: ServiceAccount
    name: fortuna-core
    namespace: {{ include "fortuna.namespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortuna-agent
  namespace: {{ include "fortuna.namespace" . }}
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fortuna-agent
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fortuna-agent
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fortuna-agent
subjects:
  - kind: ServiceAccount
    name: fortuna-agent
    namespace: {{ include "fortuna.namespace" . }}
