apiVersion: v1
kind: Service
metadata:
  name: fortuna-core
  namespace: {{ include "fortuna.namespace" . }}
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
