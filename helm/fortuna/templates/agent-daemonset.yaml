apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fortuna-agent
  namespace: {{ include "fortuna.namespace" . }}
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fortuna
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortuna
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: fortuna-agent
      hostNetwork: false
      hostPID: false
      tolerations:
        {{- toYaml .Values.agent.tolerations | nindent 8 }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.agentSecretName }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: ca-cert
          secret:
            secretName: {{ .Values.tls.caSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
      containers:
        - name: agent
          image: {{ include "fortuna.agentImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CORE_GRPC_ENDPOINT
              value: "{{ include "fortuna.coreServiceHost" . }}:9090"
            - name: CORE_HTTP_ENDPOINT
              value: "http://{{ include "fortuna.coreServiceHost" . }}:8080"
            - name: SYNC_INTERVAL
              value: {{ .Values.agent.env.syncInterval | quote }}
            - name: HEARTBEAT_INTERVAL
              value: {{ .Values.agent.env.heartbeatInterval | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TLS_ENABLED
              value: {{ .Values.agent.env.tlsEnabled | quote }}
            - name: TLS_CERT_PATH
              value: "/etc/fortuna/certs/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/fortuna/certs/tls.key"
            - name: TLS_CA_CERT_PATH
              value: "/etc/fortuna/ca-cert/ca.crt"
            - name: CONTAINERD_SOCKET
              value: {{ .Values.agent.env.containerdSocket | quote }}
            - name: CONTAINERD_NAMESPACE
              value: {{ .Values.agent.env.containerdNamespace | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.agent.env.logLevel | quote }}
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/fortuna/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/fortuna/ca-cert
              readOnly: true
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: true
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
