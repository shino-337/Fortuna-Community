apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.agent.name | default "fortuna-agent" }}
  labels:
    {{- include "fortuna.labels" . | nindent 4 }}
    app: fortuna-agent
spec:
  selector:
    matchLabels:
      app: fortuna-agent
  template:
    metadata:
      labels:
        app: fortuna-agent
    spec:
      serviceAccountName: fortuna-agent
      containers:
      - name: agent
        image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
        imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
        env:
        - name: CORE_GRPC_ENDPOINT
          value: "{{ .Values.agent.coreEndpoint }}"
        - name: CORE_HTTP_ENDPOINT
          value: 'http://{{ .Values.agent.coreHttpHost | default "fortuna-core.fortuna.svc.cluster.local" }}:{{ .Values.core.service.port | default "8080" }}'
        - name: SYNC_INTERVAL
          value: "{{ .Values.agent.syncInterval }}"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Cluster identity: auto-discovered from K8s API (kube-system UID). Optional override via agent.env.CLUSTER_ID / CLUSTER_NAME.
        resources:
          {{- toYaml .Values.agent.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

