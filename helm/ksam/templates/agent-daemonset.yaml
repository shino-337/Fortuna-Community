apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.agent.name | default "fortuna-agent" }}
  labels:
    {{- include "fortuna.labels" . | nindent 4 }}
    app: fortuna-agent
spec:
  selector:
    matchLabels:
      app: fortuna-agent
  template:
    metadata:
      labels:
        app: fortuna-agent
    spec:
      serviceAccountName: fortuna-agent
      containers:
      - name: agent
        image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
        imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
        env:
        - name: FORTUNA_CORE_ENDPOINT
          value: "{{ .Values.agent.coreEndpoint }}"
        - name: FORTUNA_CLUSTER_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: FORTUNA_SYNC_INTERVAL
          value: "{{ .Values.agent.syncInterval }}"
        resources:
          {{- toYaml .Values.agent.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

