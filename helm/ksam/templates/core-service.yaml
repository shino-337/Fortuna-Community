apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.core.name | default "fortuna-core" }}
  labels:
    app: fortuna-core
spec:
  type: {{ .Values.core.service.type }}
  ports:
  - port: {{ .Values.core.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.core.service.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    app: fortuna-core

