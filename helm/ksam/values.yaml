# Default values for Fortuna (formerly KSAM)
core:
  name: fortuna-core
  image:
    repository: fortuna-core
    tag: latest
    pullPolicy: Never  # For containerd local images. Change to IfNotPresent or Always for production registry
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 8080
    grpcPort: 9090
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  database:
    url: "postgres://postgres:postgres123@postgres:5432/fortuna?sslmode=disable"
    host: postgres
    port: 5432
    name: fortuna
    user: postgres
    password: postgres123
  
  auth:
    enabled: true
    jwtSecret: "change-me-in-production"
  
  redis:
    enabled: false
    host: redis
    port: 6379

agent:
  name: fortuna-agent
  image:
    repository: fortuna/agent
    tag: latest
    pullPolicy: Never  # For containerd local images. Change to IfNotPresent or Always for production registry
  
  coreEndpoint: "fortuna-core.fortuna.svc.cluster.local:9090"
  syncInterval: "30s"
  
  resources:
    requests:
      memory: "50Mi"
      cpu: "50m"
    limits:
      memory: "100Mi"
      cpu: "100m"

dashboard:
  name: fortuna-dashboard
  image:
    repository: fortuna/dashboard
    tag: latest
    pullPolicy: Never  # For containerd local images
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 80
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

postgresql:
  enabled: true
  auth:
    postgresPassword: postgres
    database: fortuna

