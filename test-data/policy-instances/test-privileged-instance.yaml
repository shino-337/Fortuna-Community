apiVersion: v1
kind: PolicyInstance
metadata:
  name: test-privileged-instance
spec:
  templateId: test-privileged-container
  templateVersion: v1.0.0
  instanceName: block-privileged-containers-prod
  description: Block privileged containers in production namespaces
  enabled: true
  clusters:
    - "*"  # All clusters
  namespaces:
    - production
    - prod-*
  resourceTypes:
    - Pod
    - Deployment
  action: block
  severity: critical
  customMessage: "Privileged containers are not allowed in production environments"
  autoRemediate: false
  remediationDryRun: true
  exemptions: []

