apiVersion: v1
kind: Pod
metadata:
  name: test-safe-pod
  namespace: default
  labels:
    app: test-safe
    test: policy-trigger
spec:
  containers:
    - name: safe-container
      image: nginx:latest
      securityContext:
        privileged: false
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
  restartPolicy: Never

