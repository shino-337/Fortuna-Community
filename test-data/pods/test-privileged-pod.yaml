apiVersion: v1
kind: Pod
metadata:
  name: test-privileged-pod
  namespace: default
  labels:
    app: test-privileged
    test: policy-trigger
spec:
  containers:
    - name: privileged-container
      image: nginx:latest
      securityContext:
        privileged: true
        runAsUser: 0
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
  restartPolicy: Never

