apiVersion: v1
kind: PolicyTemplate
metadata:
  name: test-privileged-container
spec:
  templateId: test-privileged-container
  version: v1.0.0
  name: Test Privileged Container Policy
  description: Test policy to detect and block privileged containers
  category: security
  defaultSeverity: critical
  celExpression: |
    resource.spec.containers.exists(c, c.securityContext.privileged == true) ||
    resource.spec.securityContext.privileged == true
  defaultScope:
    resourceTypes:
      - Pod
      - Deployment
      - StatefulSet
      - DaemonSet
    clusters: []
    namespaces: []
  defaultAction: block
  supportsRemediation: true
  remediationTemplate:
    type: patch
    operations:
      - op: replace
        path: /spec/containers/0/securityContext/privileged
        value: false
      - op: add
        path: /spec/securityContext/privileged
        value: false
  rationale: |
    Privileged containers have access to all host devices and capabilities,
    which poses a significant security risk. This policy blocks any container
    running with privileged mode enabled.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  examples:
    - name: Violation Example
      description: Pod with privileged container
      resource:
        apiVersion: v1
        kind: Pod
        metadata:
          name: privileged-pod
        spec:
          containers:
            - name: test
              image: nginx
              securityContext:
                privileged: true
    - name: Compliant Example
      description: Pod without privileged container
      resource:
        apiVersion: v1
        kind: Pod
        metadata:
          name: safe-pod
        spec:
          containers:
            - name: test
              image: nginx
              securityContext:
                privileged: false
  isSystem: false

