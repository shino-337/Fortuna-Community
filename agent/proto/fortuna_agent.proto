syntax = "proto3";

package fortuna.agent.v1;

option go_package = "github.com/ksam/core/proto/fortuna";

// AgentService handles agent registration, inventory streaming, and event streaming
service AgentService {
  // Register registers an agent with the control plane
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // StreamInventory streams inventory items from agent
  rpc StreamInventory(stream InventoryItem) returns (RegisterResponse);
  
  // StreamEvents streams runtime events from agent
  rpc StreamEvents(stream Event) returns (RegisterResponse);
  
  // Heartbeat sends periodic heartbeat from agent
  rpc Heartbeat(RegisterRequest) returns (RegisterResponse);
}

// RegisterRequest contains agent registration information
message RegisterRequest {
  string agent_id = 1;
  string cluster_id = 2;
  string node_name = 3;
  string version = 4;
}

// RegisterResponse is the response to registration
message RegisterResponse {
  bool ok = 1;
  string message = 2;
}

// InventoryItem represents a Kubernetes resource inventory item
message InventoryItem {
  string kind = 1;           // e.g., "Pod", "ServiceAccount", "Role"
  string uid = 2;
  string name = 3;
  string namespace = 4;
  map<string, string> labels = 5;
  string raw_json = 6;       // Full JSON representation
  int64 timestamp = 7;       // Unix timestamp
}

// Event represents a runtime event (eBPF, syscall, etc.)
message Event {
  string event_id = 1;
  int64 timestamp = 2;
  string cluster_id = 3;
  string node_id = 4;
  string pod_uid = 5;
  string container_id = 6;
  string process_id = 7;
  string process_name = 8;
  string syscall_name = 9;
  string syscall_args = 10;
  string src_ip = 11;
  int32 src_port = 12;
  string dst_ip = 13;
  int32 dst_port = 14;
  string event_type = 15;    // e.g., "execve", "open", "connect"
  string image_digest = 16;
  string sa_name = 18;
  string namespace = 19;
  string severity = 20;      // e.g., "low", "medium", "high", "critical"
  string raw_payload = 21;   // Full event payload as JSON
}

