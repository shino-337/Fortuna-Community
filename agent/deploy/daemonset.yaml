apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ksam-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: ksam-agent
  template:
    metadata:
      labels:
        app: ksam-agent
    spec:
      serviceAccountName: ksam-agent
      containers:
      - name: agent
        image: ksam/agent:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: KSAM_CORE_ENDPOINT
          value: "http://ksam-core:8080"
        - name: KSAM_CLUSTER_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KSAM_SYNC_INTERVAL
          value: "30s"
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "100Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

