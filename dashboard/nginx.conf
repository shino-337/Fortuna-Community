server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    # Resolve upstream at request time (Kubernetes DNS)
    resolver 10.96.0.10 valid=10s ipv6=off;
    set $upstream_core fortuna-core.fortuna.svc.cluster.local;
    proxy_pass http://$upstream_core:8080;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_set_header Host $upstream_core;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }
}
