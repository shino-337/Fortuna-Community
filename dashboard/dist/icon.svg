<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Kubernetes-style icon -->
  <g transform="translate(50, 50)">
    <!-- Hexagon shape -->
    <path d="M 0,-28 L 24,-14 L 24,14 L 0,28 L -24,14 L -24,-14 Z" 
          fill="white" opacity="0.9" stroke="white" stroke-width="2"/>
    
    <!-- Inner cube/workload representation -->
    <rect x="-12" y="-8" width="24" height="16" fill="url(#grad1)" rx="2"/>
    <rect x="-10" y="-6" width="20" height="12" fill="white" opacity="0.3" rx="1"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="-20" x2="0" y2="-8" stroke="white" stroke-width="2"/>
    <line x1="-17" y1="-10" x2="-12" y2="-4" stroke="white" stroke-width="2"/>
    <line x1="17" y1="-10" x2="12" y2="-4" stroke="white" stroke-width="2"/>
  </g>
</svg>

