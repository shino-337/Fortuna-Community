<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helmGradient" x1="100" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
  </defs>

  <!-- Background circle for better visibility -->
  <circle cx="100" cy="100" r="95" fill="#000000" />

  <!-- Decorative Tech Rings -->
  <circle cx="100" cy="100" r="85" stroke="#be185d" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
  <circle cx="100" cy="100" r="75" stroke="#be185d" stroke-width="1" opacity="0.3" />

  <!-- Spokes -->
  <g stroke="url(#helmGradient)" stroke-width="14" stroke-linecap="round">
    <line x1="100" y1="20" x2="100" y2="180" />
    <line x1="20" y1="100" x2="180" y2="100" />
    <line x1="43" y1="43" x2="157" y2="157" />
    <line x1="157" y1="43" x2="43" y2="157" />
  </g>

  <!-- Rim -->
  <circle cx="100" cy="100" r="52" stroke="#db2777" stroke-width="12" fill="none" />
  <circle cx="100" cy="100" r="52" stroke="black" stroke-width="2" stroke-opacity="0.2" fill="none" />

  <!-- Hub -->
  <circle cx="100" cy="100" r="24" fill="url(#helmGradient)" stroke="#be185d" stroke-width="2" />

  <!-- Keyhole -->
  <path
    d="M100 92 C104 92 107 95 107 99 C107 101 106 103 104 104 L 106 110 H 94 L 96 104 C 94 103 93 101 93 99 C93 95 96 92 100 92 Z"
    fill="#1a050b" 
  />
  
  <!-- Highlight -->
  <circle cx="100" cy="100" r="52" stroke="white" stroke-width="1" stroke-opacity="0.15" pointer-events="none" />
</svg>
