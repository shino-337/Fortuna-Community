# S1 — Escape → PrivEsc (hostPath + cluster-admin SA binding)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-escape
  namespace: fortuna-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crb-escape-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: sa-escape
    namespace: fortuna-test
---
apiVersion: v1
kind: Pod
metadata:
  name: escape-pod
  namespace: fortuna-test
  labels:
    fortuna.io/e2e-scenario: s1-escape-privesc
spec:
  serviceAccountName: sa-escape
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - mountPath: /host
          name: host-root
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
