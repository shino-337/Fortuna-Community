# S6 — ClusterRole excessive permission
#
# Intent: prove that a workload identity receives cluster-wide read access
# beyond the namespace boundary it operates in. The scenario is intentionally
# not cluster-admin: the risk signal is excessive scope, not maximum privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-cross-namespace-reader
  namespace: fortuna-test
  labels:
    fortuna.io/e2e-scenario: s6-clusterrole-excessive-permission
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fortuna-cross-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crb-cross-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fortuna-cross-namespace-reader
subjects:
  - kind: ServiceAccount
    name: sa-cross-namespace-reader
    namespace: fortuna-test
---
apiVersion: v1
kind: Pod
metadata:
  name: cross-namespace-reader
  namespace: fortuna-test
  labels:
    fortuna.io/e2e-scenario: s6-clusterrole-excessive-permission
spec:
  serviceAccountName: sa-cross-namespace-reader
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
