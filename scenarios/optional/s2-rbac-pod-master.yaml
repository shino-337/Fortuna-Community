# S2 pod scheduled on control-plane (for Falco/agent on same node as Fortuna stack).
# Requires: SA sa-rbac + CRB crb-rbac-admin (apply s2-rbac-only.yaml first).
apiVersion: v1
kind: Pod
metadata:
  name: rbac-pod
  namespace: fortuna-test
  labels:
    fortuna.io/e2e-scenario: s2-rbac-only
    fortuna.io/schedule: master
spec:
  serviceAccountName: sa-rbac
  nodeName: k8s-master
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
