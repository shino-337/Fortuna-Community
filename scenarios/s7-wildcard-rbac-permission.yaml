# S7 — Wildcard RBAC permission
#
# Intent: expose a workload identity with wildcard verbs/resources. The
# scenario must be correlated with the bound identity and workload; a
# wildcard rule by itself is not sufficient evidence for a critical path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-wildcard
  namespace: fortuna-test
  labels:
    fortuna.io/e2e-scenario: s7-wildcard-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-wildcard
  namespace: fortuna-test
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-wildcard
  namespace: fortuna-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: role-wildcard
subjects:
  - kind: ServiceAccount
    name: sa-wildcard
    namespace: fortuna-test
---
apiVersion: v1
kind: Pod
metadata:
  name: wildcard-rbac
  namespace: fortuna-test
  labels:
    fortuna.io/e2e-scenario: s7-wildcard-rbac
spec:
  serviceAccountName: sa-wildcard
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
