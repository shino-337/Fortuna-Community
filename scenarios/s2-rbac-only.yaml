# S2 — RBAC-only escalation (no hostPath / no escape surface)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-rbac
  namespace: fortuna-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crb-rbac-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: sa-rbac
    namespace: fortuna-test
---
apiVersion: v1
kind: Pod
metadata:
  name: rbac-pod
  namespace: fortuna-test
  labels:
    fortuna.io/e2e-scenario: s2-rbac-only
spec:
  serviceAccountName: sa-rbac
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
