syntax = "proto3";

package ksam;

option go_package = "github.com/ksam/core/proto/ksam";

// KSAM Service for agent communication
service KSAMService {
  // SyncData syncs collected data from agent
  rpc SyncData(SyncDataRequest) returns (SyncDataResponse);
  
  // HealthCheck checks if service is healthy
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// SyncDataRequest contains collected data from agent
message SyncDataRequest {
  string cluster_id = 1;
  CollectedData data = 2;
}

// SyncDataResponse is the response to sync request
message SyncDataResponse {
  bool success = 1;
  string message = 2;
}

// HealthCheckRequest is a health check request
message HealthCheckRequest {
}

// HealthCheckResponse is a health check response
message HealthCheckResponse {
  bool healthy = 1;
  string message = 2;
}

// CollectedData represents all collected data from a cluster
message CollectedData {
  repeated ServiceAccountData service_accounts = 1;
  repeated RoleBindingData role_bindings = 2;
  repeated ClusterRoleBindingData cluster_role_bindings = 3;
  repeated RoleData roles = 4;
  repeated ClusterRoleData cluster_roles = 5;
  repeated PodData pods = 6;
  int64 collected_at = 7; // Unix timestamp
}

// ServiceAccountData represents a ServiceAccount
message ServiceAccountData {
  string name = 1;
  string namespace = 2;
  string uid = 3;
  map<string, string> labels = 4;
  repeated string secrets = 5;
  int64 created_at = 6; // Unix timestamp
}

// RoleBindingData represents a RoleBinding
message RoleBindingData {
  string name = 1;
  string namespace = 2;
  string uid = 3;
  RoleRef role_ref = 4;
  repeated Subject subjects = 5;
  int64 created_at = 6; // Unix timestamp
}

// ClusterRoleBindingData represents a ClusterRoleBinding
message ClusterRoleBindingData {
  string name = 1;
  string uid = 2;
  RoleRef role_ref = 3;
  repeated Subject subjects = 4;
  int64 created_at = 5; // Unix timestamp
}

// RoleData represents a Role
message RoleData {
  string name = 1;
  string namespace = 2;
  string uid = 3;
  repeated PolicyRule rules = 4;
  int64 created_at = 5; // Unix timestamp
}

// ClusterRoleData represents a ClusterRole
message ClusterRoleData {
  string name = 1;
  string uid = 2;
  repeated PolicyRule rules = 3;
  int64 created_at = 4; // Unix timestamp
}

// PodData represents a Pod
message PodData {
  string name = 1;
  string namespace = 2;
  string service_account = 3;
  string uid = 4;
}

// RoleRef represents a role reference
message RoleRef {
  string api_group = 1;
  string kind = 2;
  string name = 3;
}

// Subject represents a subject in a binding
message Subject {
  string kind = 1;
  string api_group = 2;
  string name = 3;
  string namespace = 4;
}

// PolicyRule represents a policy rule
message PolicyRule {
  repeated string verbs = 1;
  repeated string api_groups = 2;
  repeated string resources = 3;
  repeated string resource_names = 4;
  repeated string non_resource_urls = 5;
}

