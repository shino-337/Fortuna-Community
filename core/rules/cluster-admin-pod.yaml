# Cluster Admin Pod Rule
# Detects pods using ServiceAccounts bound to cluster-admin

id: cluster-admin-pod
name: "Pod using ServiceAccount with cluster-admin access"
category: rbac
severity: critical
description: "Pod is using a ServiceAccount that is bound to cluster-admin ClusterRole, granting full cluster access"
enabled: true

conditions:
  # CEL: input is "object" (Pod). spec.serviceAccountName is the K8s field.
  - type: expression
    expression: |
      object.kind == "Pod" &&
      object.spec != null &&
      object.spec.serviceAccountName != "" &&
      object.spec.serviceAccountName != "default"

# Note: This rule will match pods, but the actual cluster-admin binding
# detection should be done via RoleBinding/ClusterRoleBinding evaluation
# For now, we'll create a rule that can be enhanced with correlation data

aggregation: AND
base_score: 10.0
tags:
  - cluster-admin
  - critical
  - pod
  - overprivileged

