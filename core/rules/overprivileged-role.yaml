# Overprivileged Role Rule
# Detects roles with excessive permissions

id: overprivileged-role
name: "Role with excessive permissions"
category: rbac
severity: high
description: "Role grants permissions to sensitive resources (secrets, configmaps, pods)"
enabled: true

conditions:
  - type: expression
    expression: "rules[].resources contains 'secrets' || rules[].resources contains 'configmaps' || rules[].resources contains 'pods'"

aggregation: OR
base_score: 7.0
tags:
  - overprivileged
  - sensitive-resources

