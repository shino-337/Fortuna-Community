# PSS restricted/baseline: privileged containers (evaluated on normalized Pod from inventory).
id: pss-privileged-container
name: "Pod has a privileged container"
category: pod-security
severity: high
description: "At least one container sets securityContext.privileged true"
enabled: true

conditions:
  - type: expression
    expression: |
      object.kind == "Pod" &&
      object.spec != null &&
      (object.spec.containers.exists(c, has(c.securityContext) && c.securityContext.privileged == true) ||
       (has(object.spec.initContainers) &&
        object.spec.initContainers.exists(c, has(c.securityContext) && c.securityContext.privileged == true)))

aggregation: AND
base_score: 8.0
tags:
  - pss
  - pod-security
  - privileged
  # MITRE ATT&CK for Containers: Escape to Host (privileged containers enable breakout)
  - T1611
