# Pod Security Standards–style check on synced Pod spec (admission-like).
# Detects containers without resource limits.

id: pss-absence-resource-limits
name: "Pod containers missing resource limits"
category: pod-security
severity: medium
description: "At least one container lacks resources.limits and/or its cpu/memory limit fields; violates resource governance baseline"
enabled: true

conditions:
  - type: expression
    expression: |
      object.kind == "Pod" &&
      object.spec != null &&
      (
        (
          has(object.spec.containers) &&
          object.spec.containers.exists(c,
            !has(c.resources) ||
            !has(c.resources.limits) ||
            (!has(c.resources.limits.cpu) && !has(c.resources.limits.memory))
          )
        ) ||
        (
          has(object.spec.initContainers) &&
          object.spec.initContainers.exists(c,
            !has(c.resources) ||
            !has(c.resources.limits) ||
            (!has(c.resources.limits.cpu) && !has(c.resources.limits.memory))
          )
        )
      )

aggregation: AND
base_score: 5.5
tags:
  - pss
  - pod-security
  - resource-governance
  # Best-effort MITRE mapping: resource exhaustion / availability impact
  - T1499

