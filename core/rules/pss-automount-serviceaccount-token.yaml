# Pod Security Standards–style check on synced Pod spec (admission-like).
# Detects the ServiceAccount token being automatically mounted.

id: pss-automount-serviceaccount-token
name: "Pod automounts ServiceAccount token"
category: pod-security
severity: medium
description: "automountServiceAccountToken is enabled; containers may access the Kubernetes API via mounted SA token"
enabled: true

conditions:
  - type: expression
    expression: |
      object.kind == "Pod" &&
      object.spec != null &&
      has(object.spec.automountServiceAccountToken) &&
      object.spec.automountServiceAccountToken == true

aggregation: AND
base_score: 6.5
tags:
  - pss
  - pod-security
  - serviceaccount
  - token
  # MITRE ATT&CK for Containers: Container API Credentials
  - T1552.007

