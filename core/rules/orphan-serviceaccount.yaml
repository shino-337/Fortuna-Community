# Orphan ServiceAccount Rule
# Detects ServiceAccounts not used by any pod

id: orphan-serviceaccount
name: "Orphan ServiceAccount (not used by any pod)"
category: rbac
severity: low
description: "ServiceAccount exists but is not used by any pod"
enabled: true

conditions:
  - type: resource
    field: linkedPods
    operator: eq
    value: "[]"

aggregation: AND
base_score: 2.0
tags:
  - orphan
  - unused

