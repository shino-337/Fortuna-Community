# CIS Kubernetes Benchmark 5.1.8: Minimize access to create roles and clusterroles

id: cis-5.1.8
name: "Role allows creating RBAC roles (roles/clusterroles)"
category: rbac
severity: critical
description: "Role/ClusterRole allows creating or updating roles/clusterroles; can enable permission escalation"
enabled: true

conditions:
  - type: expression
    expression: |
      object.rules.exists(r,
        (r.resources.exists(res, res == 'roles') || r.resources.exists(res, res == 'clusterroles')) &&
        r.verbs.exists(v, v == 'create' || v == 'update' || v == 'patch' || v == '*' )
      )

aggregation: AND
base_score: 9.5
tags:
  - cis
  - rbac
  - roles
  - escalation
  # MITRE ATT&CK for Containers: Kubernetes RBAC Abuse
  - T1612
  # Privilege escalation mapping
  - T1068

