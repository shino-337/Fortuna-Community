id: toxic-combo-clusteradmin-escape-runtime
name: "Toxic combo: cluster-admin SA + escape signals"
category: runtime-behavior
severity: critical
description: "Pod combines cluster-admin ServiceAccount binding with runtime escape-related behavior."
enabled: true
conditions:
  - type: expression
    expression: |
      object.kind == "Pod" &&
      (
        (has(object.securityState) &&
          object.securityState.service_account_bound_to_cluster_admin == true &&
          object.securityState.has_escape_related == true &&
          object.securityState.signal_total_24h > 0)
        ||
        (has(object.fortuna) &&
          object.fortuna.service_account_bound_to_cluster_admin == true &&
          object.fortuna.has_escape_related == true &&
          object.fortuna.signal_total_24h > 0)
      )
aggregation: AND
base_score: 10.0
tags:
  - toxic-combination
  - runtime
  - rbac
  - escape
  - T1098.006
  - T1611

