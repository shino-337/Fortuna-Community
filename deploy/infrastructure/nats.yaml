apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: fortuna
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    # Single node mode - no cluster needed for 1 replica
    jetstream {
      max_mem: 2GB
      max_file: 10GB
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-pvc-0
  namespace: fortuna
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
# PVCs for additional replicas (commented out for single replica setup)
# Uncomment if scaling to 2-3 replicas
