apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: fortuna
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    # Cluster mode for 3 replicas with quorum support
    cluster {
      name: fortuna-nats-cluster
      port: 6222
      routes = [
        nats://nats-0.nats.fortuna.svc.cluster.local:6222
        nats://nats-1.nats.fortuna.svc.cluster.local:6222
        nats://nats-2.nats.fortuna.svc.cluster.local:6222
      ]
    }
    jetstream {
      store_dir: /data/jetstream
      max_mem: 2GB
      max_file: 10GB
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: fortuna
spec:
  serviceName: nats
  replicas: 3
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        command:
        - /bin/sh
        - -c
        - |
          cat > /tmp/nats.conf <<EOF
          port: 4222
          http_port: 8222
          server_name: ${POD_NAME}
          # Cluster mode for 3 replicas
          # Only connect to other pods (not self)
          cluster {
            name: fortuna-nats-cluster
            port: 6222
            routes = [
              nats://nats-0.nats.fortuna.svc.cluster.local:6222
              nats://nats-1.nats.fortuna.svc.cluster.local:6222
              nats://nats-2.nats.fortuna.svc.cluster.local:6222
            ]
            # Cluster will auto-connect to available routes
            no_advertise: false
          }
          jetstream {
            store_dir: /data/jetstream
            max_mem: 2GB
            max_file: 10GB
          }
          EOF
          exec nats-server -c /tmp/nats.conf -js
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitor
        - containerPort: 6222
          name: cluster
        volumeMounts:
        - name: config
          mountPath: /etc/nats
        - name: data
          mountPath: /data/jetstream
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: nats-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: fortuna
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
  - port: 4222
    targetPort: 4222
    name: client
  - port: 8222
    targetPort: 8222
    name: monitor
  - port: 6222
    targetPort: 6222
    name: cluster
---
apiVersion: v1
kind: Service
metadata:
  name: nats-client
  namespace: fortuna
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
  - port: 4222
    targetPort: 4222
    name: client
  - port: 8222
    targetPort: 8222
    name: monitor
