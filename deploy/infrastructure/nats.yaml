metadata:
  name: nats
  namespace: fortuna
spec:
  publishNotReadyAddresses: true
  clusterIP: None
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
      name: client
    - port: 8222
      targetPort: 8222
      name: monitor
    - port: 6222
      targetPort: 6222
      name: cluster
---
apiVersion: v1
kind: Service
metadata:
  name: nats-client
  namespace: fortuna
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
