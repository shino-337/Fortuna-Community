# Restrict the data plane to Fortuna Core.
#
# NATS runs without client authentication, so any pod that can reach it could
# publish forged events (for example fortuna.policy.violation.detected, which
# Core turns into Insights) and bypass agent identity entirely. Postgres holds
# cluster kubeconfigs and all findings. Only Core needs either service.
#
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, ...). Flannel alone
# does not enforce these rules; on such clusters they are accepted but inert.
# `kubectl exec` (used by operator scripts) is not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-allow-core-only
  namespace: fortuna
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes:
    - Ingress
  ingress:
    # Client connections (4222) from Core only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fortuna
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: 4222
    # Cluster routes (6222) and monitoring (8222) between NATS peers only.
    - from:
        - podSelector:
            matchLabels:
              app: nats
      ports:
        - protocol: TCP
          port: 6222
        - protocol: TCP
          port: 8222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-core-only
  namespace: fortuna
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fortuna
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: 5432
