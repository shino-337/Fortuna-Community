# Example only. Do not apply this file with literal placeholder values.
# Prefer ./scripts/utils/ensure-fortuna-secrets.sh, which creates this Secret from env vars.
apiVersion: v1
kind: Secret
metadata:
  name: fortuna-secrets
  namespace: fortuna
  annotations:
    fortuna.dev/credential-policy: "replace-before-production"
type: Opaque
stringData:
  database-url: "${FORTUNA_DATABASE_URL}"
  jwt-secret: "${FORTUNA_JWT_SECRET}"
  admin-password: "${FORTUNA_ADMIN_PASSWORD}"
  # Set to "true" only when admin-password is the first-login bootstrap default.
  bootstrap-default-credential: "false"
  # Required by Core/Agent HTTP ingest. The helper script generates it when omitted.
  ingest-token: "${FORTUNA_INGEST_TOKEN}"
