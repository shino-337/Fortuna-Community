{{- if and .Values.core.enabled .Values.core.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fortuna-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  ports:
    - name: webhook
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
{{- end }}
