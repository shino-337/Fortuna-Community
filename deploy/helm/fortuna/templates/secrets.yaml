{{- if and (eq .Values.manifestMode "helm") .Values.secrets.create }}
{{- $s := include "fortuna.generatedSecrets" . | fromYaml }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fortuna-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  database-url: {{ $s.databaseUrl | b64enc | quote }}
  jwt-secret: {{ $s.jwtSecret | b64enc | quote }}
  ingest-token: {{ $s.ingestToken | b64enc | quote }}
  admin-password: {{ $s.adminPassword | b64enc | quote }}
  # The admin password above is random or chosen by you, never the documented default.
  bootstrap-default-credential: {{ "false" | b64enc | quote }}
  pod-detail-encryption-key: {{ $s.podDetailEncryptionKey | b64enc | quote }}
  {{- with $s.podDetailEncryptionKeyPrevious }}
  pod-detail-encryption-key-previous: {{ . | b64enc | quote }}
  {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $s.postgresPassword | b64enc | quote }}
{{- end }}
{{- end }}
