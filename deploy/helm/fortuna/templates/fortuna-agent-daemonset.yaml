{{- if .Values.agent.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fortuna-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fortuna
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortuna
        app.kubernetes.io/component: agent
      annotations:
        kubectl.kubernetes.io/default-container: agent
    spec:
      serviceAccountName: fortuna-agent
      {{- include "fortuna.imagePullSecrets" . | nindent 6 }}
      # Privileges are kept to what the Agent uses and are checked in CI by
      # scripts/verify/test-agent-privileges.py; see the "Agent privileges"
      # section of docs/reference/SECURITY.md before adding any.
      # No hostPID/hostNetwork/hostIPC: process and socket data are read from the
      # read-only host /proc mount below.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # The ServiceAccount token is projected into the agent container only
      # (kube-api-access below), never into image-export.
      automountServiceAccountToken: false
      {{- with .Values.agent.tolerations }}
      # Runs on every node, including tainted control-plane nodes.
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        # mTLS certificates
        - name: tls-certs
          secret:
            secretName: fortuna-agent-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: ca-cert
          secret:
            secretName: fortuna-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        # Containerd socket: mounted only into the image-export container.
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        # Host /proc, read-only: process and socket data from the node, no exec.
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        {{- if .Values.agent.falco.enabled }}
        # Falco JSONL: Falco must write /var/log/falco/events.jsonl on each node.
        - name: falco-events
          hostPath:
            path: /var/log/falco
            type: DirectoryOrCreate
        {{- end }}
        - name: delivery-state
          hostPath:
            path: /var/lib/fortuna-agent
            type: DirectoryOrCreate
        # Scratch space for SBOM extraction (image layers, syft cache). The root
        # filesystem is read-only.
        - name: scratch
          emptyDir:
            sizeLimit: 10Gi
        # Pod-local unix socket between the agent and image-export containers.
        - name: image-export
          emptyDir:
            sizeLimit: 1Mi

      containers:
        - name: agent
          image: {{ include "fortuna.image" (dict "root" . "image" .Values.agent.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            # Core endpoints
            - name: CORE_GRPC_ENDPOINT
              value: {{ include "fortuna.coreGrpcEndpoint" . | quote }}
            - name: CORE_HTTP_ENDPOINT
              value: {{ include "fortuna.coreHttpEndpoint" . | quote }}
            - name: FORTUNA_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fortuna-secrets
                  key: ingest-token
                  optional: false
            # The cluster id and name are discovered from the API server (kubeadm-config,
            # node labels, the default API Service, or cluster-<shortID>).
            {{- with .Values.agent.clusterId }}
            - name: CLUSTER_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.clusterName }}
            - name: CLUSTER_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: SYNC_INTERVAL
              value: {{ .Values.agent.syncInterval | quote }}
            # Heartbeat to Core; keeps last_seen_at fresh on the dashboard.
            - name: HEARTBEAT_INTERVAL
              value: {{ .Values.agent.heartbeatInterval | quote }}

            # Node info. The Agent id defaults to <NODE_NAME>-agent (AGENT_ID overrides it).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # mTLS Configuration
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_PATH
              value: "/etc/fortuna/certs/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/fortuna/certs/tls.key"
            - name: TLS_CA_CERT_PATH
              value: "/etc/fortuna/ca-cert/ca.crt"

            # SBOM: image archives come from the image-export container; this
            # container has no containerd socket.
            - name: IMAGE_EXPORT_SOCKET
              value: "/run/fortuna-image-export/export.sock"

            # Logging
            - name: LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}
            # Host /proc mount used by the process and network collectors.
            - name: POD_DETAIL_PROC_ROOT
              value: "/host/proc"
            # Approximate per-process CPU% from /proc; set false to disable
            - name: POD_DETAIL_PROCESS_CPU_APPROX_FROM_PROC
              value: "true"
            # Falco JSONL to Core. First use skips existing records; later rollouts
            # resume from the durable cursor. Never clear logs or state to retry ingestion.
            - name: FALCO_EVENTS_ENABLED
              value: {{ .Values.agent.falco.enabled | quote }}
            {{- if .Values.agent.falco.enabled }}
            - name: FALCO_EVENTS_PATH
              value: "/var/log/falco/events.jsonl"
            - name: FALCO_EVENTS_POLL
              value: "5s"
            {{- end }}
            # Persistent cursor/outbox survives Agent rollout. Source log stays read-only.
            - name: FALCO_DELIVERY_STATE_PATH
              value: "/var/lib/fortuna-agent/falco-delivery.json"
            - name: RUNTIME_COVERAGE_CADENCE
              value: "30s"
            # Writable paths live on the scratch emptyDir (read-only root filesystem).
            - name: TMPDIR
              value: "/tmp"
            - name: HOME
              value: "/tmp"
            - name: XDG_CACHE_HOME
              value: "/tmp/.cache"
            - name: SBOM_CACHE_DIR
              value: "/tmp/sbom-cache"
            # SBOM queue workers; 1 keeps peak memory low when many pods queue at once.
            - name: SBOM_WORKERS
              value: {{ .Values.agent.sbomWorkers | quote }}
            # Experimental eBPF scaffold. It needs extra capabilities that this
            # manifest deliberately does not grant; leave it disabled.
            - name: EBPF_ENABLED
              value: "false"
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          volumeMounts:
            - name: tls-certs
              mountPath: /etc/fortuna/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/fortuna/ca-cert
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: image-export
              mountPath: /run/fortuna-image-export
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            {{- if .Values.agent.falco.enabled }}
            - name: falco-events
              mountPath: /var/log/falco
              readOnly: true
            {{- end }}
            - name: delivery-state
              mountPath: /var/lib/fortuna-agent
            - name: scratch
              mountPath: /tmp

          # SBOM extraction and the Falco backlog need headroom; 2Gi caused OOM kills.
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}

          # Root (uid 0) with every capability dropped: it cannot override file
          # permissions, load eBPF, ptrace or change kernel settings. It is kept
          # for the root-owned Falco log and delivery state on existing nodes.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

        # The only container with the containerd socket. It has no ServiceAccount
        # token, no Core credentials and no other host mounts, and answers one
        # request type ("stream the archive for this image reference") on the
        # pod-local socket. It never parses image content.
        - name: image-export
          image: {{ include "fortuna.image" (dict "root" . "image" .Values.agent.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/fortuna-image-export"]
          env:
            - name: IMAGE_EXPORT_SOCKET
              value: "/run/fortuna-image-export/export.sock"
            - name: CONTAINERD_SOCKET
              value: "/run/containerd/containerd.sock"
            - name: CONTAINERD_NAMESPACE
              value: "k8s.io"
          volumeMounts:
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            - name: image-export
              mountPath: /run/fortuna-image-export
          resources:
            {{- toYaml .Values.agent.imageExport.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
