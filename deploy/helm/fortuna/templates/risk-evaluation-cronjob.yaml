{{- if and .Values.core.enabled .Values.core.riskEvaluationCronJob.enabled }}
---
# Triggers historical risk evaluation on a schedule. It signs in as a service
# account that holds only risk.evaluate, never as the admin.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fortuna-risk-evaluation
  namespace: {{ .Release.Namespace }}
  labels:
    app: fortuna-risk-evaluation
spec:
  schedule: {{ .Values.core.riskEvaluationCronJob.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: fortuna-risk-evaluation
        spec:
          # Talks to Core over HTTP only; it needs no Kubernetes API access.
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: risk-evaluator
              image: {{ .Values.core.riskEvaluationCronJob.image }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Starting risk evaluation at $(date)"
                  echo "Authenticating..."
                  # The password and token go to curl on stdin (printf is a shell builtin), never
                  # as arguments: command lines are visible in /proc to anything on the node.
                  TOKEN=$(printf '{"username":"%s","password":"%s"}' "${EVALUATOR_USERNAME}" "${EVALUATOR_PASSWORD}" \
                    | curl -sS -X POST "${CORE_SERVICE_URL}/api/v1/auth/login" \
                      -H "Content-Type: application/json" \
                      --data-binary @- \
                    | grep -o '"token":"[^"]*' | cut -d'"' -f4 || true)
                  if [ -z "$TOKEN" ]; then
                    echo "ERROR: Failed to get authentication token"
                    exit 1
                  fi

                  echo "Token obtained, triggering risk evaluation..."
                  RESPONSE=$(printf 'Authorization: Bearer %s\n' "${TOKEN}" \
                    | curl -sS -w "\nHTTP_CODE:%{http_code}" -X POST \
                      "${CORE_SERVICE_URL}/api/v1/risk/insights/evaluate/historical" \
                      -H "Content-Type: application/json" \
                      -H @-)
                  HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
                  BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE:/d')
                  echo "Response: $BODY"
                  if [ "$HTTP_CODE" = "200" ]; then
                    echo "Risk evaluation completed successfully"
                  else
                    echo "Risk evaluation failed with HTTP code: $HTTP_CODE"
                    exit 1
                  fi
              env:
                - name: CORE_SERVICE_URL
                  value: "http://{{ include "fortuna.coreHost" . }}:8080"
                - name: EVALUATOR_USERNAME
                  value: {{ .Values.core.riskEvaluationCronJob.username | quote }}
                - name: EVALUATOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: fortuna-secrets
                      key: risk-evaluator-password
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
              securityContext:
                runAsNonRoot: true
                runAsUser: 100
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
{{- end }}
