{{- if .Values.dashboard.enabled }}
{{- $ns := .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortuna-dashboard
  namespace: {{ $ns }}
  labels:
    app: fortuna-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortuna-dashboard
  template:
    metadata:
      labels:
        app: fortuna-dashboard
    spec:
      {{- include "fortuna.imagePullSecrets" . | nindent 6 }}
      # The dashboard needs no Kubernetes API access.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: {{ include "fortuna.image" (dict "root" . "image" .Values.dashboard.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Core Service that nginx proxies /api/ to (dashboard/nginx/default.conf.template).
            - name: FORTUNA_CORE_HOST
              value: {{ include "fortuna.coreHost" . | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          # The stock nginx image starts as root and drops to the nginx user for workers.
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: fortuna-dashboard
  namespace: {{ $ns }}
  labels:
    app: fortuna-dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: fortuna-dashboard
{{- end }}
