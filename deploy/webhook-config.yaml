# Generated from deploy/helm/fortuna by scripts/build/render-manifests.sh.
# Do not edit: change the chart and re-render. CI fails when they differ.
---
# See docs/operations/WEBHOOK.md before switching failurePolicy to Fail.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: fortuna-policy-webhook
webhooks:
  - name: validate.fortuna.io
    clientConfig:
      service:
        name: fortuna-webhook
        namespace: fortuna
        path: /admission/validate
        port: 443
      # Run scripts/deploy/enable-webhook.sh to inject the installed CA before applying.

    # Only Pods are evaluated. Workload controllers (Deployments, StatefulSets,
    # DaemonSets, ReplicaSets) are still covered because the Pods they create
    # pass through this webhook. Do not route controller kinds here: Core does
    # not parse them and its fail-closed default would deny every rollout.
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]

    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    # Keep Ignore until certificate, endpoint and policy checks pass.
    failurePolicy: Ignore

    # Only namespaces labelled fortuna.io/policy-enabled=true are evaluated.
    namespaceSelector:
      matchExpressions:
        - key: fortuna.io/policy-enabled
          operator: In
          values: ["true"]
