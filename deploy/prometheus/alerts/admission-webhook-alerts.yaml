apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: admission-webhook-alerts
  namespace: fortuna
  labels:
    app: ksam
    component: admission-webhook
spec:
  groups:
    - name: admission_webhook
      interval: 30s
      rules:
        # Alert: Admission Webhook High Latency
        - alert: AdmissionWebhookHighLatency
          expr: |
            histogram_quantile(0.95, 
              rate(admission_latency_ms_bucket[5m])
            ) > 100
          for: 5m
          labels:
            severity: warning
            component: admission-webhook
          annotations:
            summary: "Admission webhook latency is high (P95 > 100ms)"
            description: |
              Admission webhook P95 latency is {{ $value }}ms (threshold: 100ms).
              This may cause deployment timeouts.
              Check webhook logs for performance issues.

        # Alert: Admission Webhook Very High Latency
        - alert: AdmissionWebhookVeryHighLatency
          expr: |
            histogram_quantile(0.95, 
              rate(admission_latency_ms_bucket[5m])
            ) > 200
          for: 2m
          labels:
            severity: critical
            component: admission-webhook
          annotations:
            summary: "Admission webhook latency is very high (P95 > 200ms)"
            description: |
              Admission webhook P95 latency is {{ $value }}ms (threshold: 200ms).
              This will likely cause deployment timeouts.
              Immediate investigation required.

        # Alert: Admission Webhook High Error Rate
        - alert: AdmissionWebhookHighErrorRate
          expr: |
            rate(admission_errors_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
            component: admission-webhook
          annotations:
            summary: "Admission webhook error rate is high"
            description: |
              Admission webhook error rate is {{ $value }} errors/second (threshold: 0.1/s).
              Check webhook logs for error details.

        # Alert: Admission Webhook Event Publish Failures
        - alert: AdmissionWebhookEventPublishFailures
          expr: |
            rate(event_publish_fail_count{event_type="violation_detected"}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            component: admission-webhook
          annotations:
            summary: "Event publish failures detected"
            description: |
              Event publish failure rate is {{ $value }} failures/second (threshold: 0.05/s).
              Violations may not be recorded in database.
              Check NATS connectivity and worker status.

        # Alert: Admission Webhook High Denial Rate
        - alert: AdmissionWebhookHighDenialRate
          expr: |
            rate(admission_denied_count[5m]) > 10
          for: 5m
          labels:
            severity: info
            component: admission-webhook
          annotations:
            summary: "High number of admission denials"
            description: |
              Admission denial rate is {{ $value }} denials/second.
              This may indicate policy misconfiguration or cluster-wide issues.
              Review denied resources and policy rules.

        # Alert: CEL Evaluation High Latency
        - alert: CELEvaluationHighLatency
          expr: |
            histogram_quantile(0.95, 
              rate(cel_eval_ms_bucket[5m])
            ) > 50
          for: 5m
          labels:
            severity: warning
            component: policy-evaluator
          annotations:
            summary: "CEL evaluation latency is high (P95 > 50ms)"
            description: |
              CEL evaluation P95 latency is {{ $value }}ms (threshold: 50ms).
              This may impact webhook performance.
              Check CEL expression complexity and program cache.

        # Alert: Admission Webhook No Requests
        - alert: AdmissionWebhookNoRequests
          expr: |
            rate(admission_allowed_count[5m]) + rate(admission_denied_count[5m]) == 0
          for: 10m
          labels:
            severity: warning
            component: admission-webhook
          annotations:
            summary: "No admission webhook requests received"
            description: |
              No admission webhook requests received in the last 10 minutes.
              Check if webhook is registered and configured correctly.

