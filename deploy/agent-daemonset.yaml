apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fortuna-agent
  namespace: fortuna
  labels:
    app: fortuna-agent
spec:
  selector:
    matchLabels:
      app: fortuna-agent
  template:
    metadata:
      labels:
        app: fortuna-agent
    spec:
      serviceAccountName: fortuna-agent
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
        - "10.96.0.10"
        searches:
        - "fortuna.svc.cluster.local"
        - "svc.cluster.local"
        - "cluster.local"
        options:
        - name: "ndots"
          value: "5"
        - name: "timeout"
          value: "5"
        - name: "attempts"
          value: "5"
      containers:
      - name: agent
        # Production: Use versioned tag (e.g., fortuna/agent:v1.0.0)
        # Development: Use latest with imagePullPolicy: Never
        # Image should be built with: nerdctl build -f agent/Dockerfile -t fortuna/agent:latest --namespace k8s.io .
        image: fortuna/agent:latest
        imagePullPolicy: IfNotPresent  # For containerd local images. Change to IfNotPresent or Always for production registry
        env:
        - name: CORE_GRPC_ENDPOINT
          value: "fortuna-core.fortuna.svc.cluster.local:9090"
        - name: CORE_HTTP_ENDPOINT
          value: "http://fortuna-core.fortuna.svc.cluster.local:8080"
        # Cluster: set from env/ConfigMap (e.g. kubectl config get-clusters); no hardcoded value
        - name: SYNC_INTERVAL
          value: "5m"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: TLS_ENABLED
          value: "true"
        - name: TLS_CA_CERT_PATH
          value: "/etc/fortuna/ca-cert/ca.crt"
        - name: TLS_CERT_PATH
          value: "/etc/fortuna/certs/tls.crt"
        - name: TLS_KEY_PATH
          value: "/etc/fortuna/certs/tls.key"
        - name: CONTAINERD_SOCKET
          value: "/run/containerd/containerd.sock"
        - name: CONTAINERD_NAMESPACE
          value: "k8s.io"
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/fortuna/certs
          readOnly: true
        - name: ca-cert
          mountPath: /etc/fortuna/ca-cert
          readOnly: true
        - name: containerd-socket
          mountPath: /run/containerd/containerd.sock
          readOnly: true
        resources:
          requests:
            memory: "256Mi"  # Reduced from 512Mi
            cpu: "100m"      # Reduced from 200m
          limits:
            memory: "1Gi"   # Reduced from 2Gi to prevent OOM
            cpu: "500m"     # Reduced from 1000m
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tls-certs
        secret:
          secretName: fortuna-agent-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: ca-cert
        secret:
          secretName: fortuna-ca-cert
          items:
          - key: ca.crt
            path: ca.crt
      - name: containerd-socket
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket

