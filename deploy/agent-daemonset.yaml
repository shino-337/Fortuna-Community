apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ksam-agent
  namespace: fortuna
  labels:
    app: fortuna-agent
spec:
  selector:
    matchLabels:
      app: fortuna-agent
  template:
    metadata:
      labels:
        app: fortuna-agent
    spec:
      serviceAccountName: ksam-agent
      containers:
      - name: agent
        image: docker.io/fortuna/agent:latest
        imagePullPolicy: Never
        env:
        - name: FORTUNA_CORE_ENDPOINT
          value: "ksam-core.fortuna.svc.cluster.local:9090"
        - name: FORTUNA_CLUSTER_ID
          value: "minikube"
        - name: FORTUNA_SYNC_INTERVAL
          value: "30s"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: TLS_ENABLED
          value: "true"
        - name: TLS_CA_CERT_PATH
          value: "/etc/ksam/ca-cert/ca.crt"
        - name: TLS_CERT_PATH
          value: "/etc/ksam/certs/tls.crt"
        - name: TLS_KEY_PATH
          value: "/etc/ksam/certs/tls.key"
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/ksam/certs
          readOnly: true
        - name: ca-cert
          mountPath: /etc/ksam/ca-cert
          readOnly: true
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "100Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tls-certs
        secret:
          secretName: ksam-agent-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: ca-cert
        secret:
          secretName: ksam-ca-cert
          items:
          - key: ca.crt
            path: ca.crt

