apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fortuna-agent
  namespace: fortuna
  labels:
    app: fortuna-agent
spec:
  selector:
    matchLabels:
      app: fortuna-agent
  template:
    metadata:
      labels:
        app: fortuna-agent
    spec:
      serviceAccountName: fortuna-agent
      containers:
      - name: agent
        # Production: Use versioned tag (e.g., fortuna/agent:v1.0.0)
        # Development: Use latest with imagePullPolicy: Never
        # Image should be built with: nerdctl build -f agent/Dockerfile -t fortuna/agent:latest --namespace k8s.io .
        image: fortuna/agent:latest
        imagePullPolicy: IfNotPresent  # For containerd local images. Change to IfNotPresent or Always for production registry
        env:
        - name: FORTUNA_CORE_ENDPOINT
          value: "fortuna-core.fortuna.svc.cluster.local:9090"
        - name: FORTUNA_CLUSTER_ID
          value: "minikube"
        - name: FORTUNA_SYNC_INTERVAL
          value: "30s"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: TLS_ENABLED
          value: "true"
        - name: TLS_CA_CERT_PATH
          value: "/etc/fortuna/ca-cert/ca.crt"
        - name: TLS_CERT_PATH
          value: "/etc/fortuna/certs/tls.crt"
        - name: TLS_KEY_PATH
          value: "/etc/fortuna/certs/tls.key"
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/fortuna/certs
          readOnly: true
        - name: ca-cert
          mountPath: /etc/fortuna/ca-cert
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tls-certs
        secret:
          secretName: fortuna-agent-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: ca-cert
        secret:
          secretName: fortuna-ca-cert
          items:
          - key: ca.crt
            path: ca.crt

