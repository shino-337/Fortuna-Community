# ConfigMap for dashboard nginx config - fixes proxy to Core (resolver + timeouts)
apiVersion: v1
kind: ConfigMap
metadata:
  name: fortuna-dashboard-nginx
  namespace: fortuna
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri /index.html;
      }

      location /api/ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $upstream_core fortuna-core.fortuna.svc.cluster.local;
        proxy_pass http://$upstream_core:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        # WebSocket: required for /api/v1/ws/pod/:uid and /api/v1/ws/risks (auth via ?token=)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $upstream_core;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
      }
    }
