apiVersion: v1
kind: Namespace
metadata:
  name: fortuna-e2e
---
apiVersion: v1
kind: Pod
metadata:
  name: fortuna-e2e-poddetail-ping
  namespace: fortuna-e2e
  labels:
    app: fortuna-e2e-poddetail
    test: e2e-poddetail-ping
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-master
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: ping
      image: debian:bookworm-slim
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends iproute2 procps iputils-ping netcat-openbsd >/dev/null && rm -rf /var/lib/apt/lists/*
          # Ping (ICMP) for process list; agent network collector uses ss -tunap (TCP/UDP only), so open a TCP connection periodically
          ( while true; do timeout 14 nc -v 8.8.8.8 53 2>/dev/null || true; sleep 6; done ) &
          while true; do ping -c1 8.8.8.8 || true; sleep 5; done
