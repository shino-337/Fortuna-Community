apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortuna-dashboard
  namespace: fortuna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortuna-dashboard
  template:
    metadata:
      labels:
        app: fortuna-dashboard
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: dashboard
        image: fortuna-dashboard:latest
        # Never pull: image must be built/loaded on node (e.g. nerdctl build on k8s-master)
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: nginx-config
        configMap:
          name: fortuna-dashboard-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: fortuna-dashboard
  namespace: fortuna
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: fortuna-dashboard

