# Generated from deploy/helm/fortuna by scripts/build/render-manifests.sh.
# Do not edit: change the chart and re-render. CI fails when they differ.
---
apiVersion: v1
kind: Service
metadata:
  name: fortuna-dashboard
  namespace: fortuna
  labels:
    app: fortuna-dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: fortuna-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortuna-dashboard
  namespace: fortuna
  labels:
    app: fortuna-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortuna-dashboard
  template:
    metadata:
      labels:
        app: fortuna-dashboard
    spec:
      
      # The dashboard needs no Kubernetes API access.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/shino-337/fortuna-community/fortuna-dashboard:latest
          imagePullPolicy: IfNotPresent
          env:
            # Core Service that nginx proxies /api/ to (dashboard/nginx/default.conf.template).
            - name: FORTUNA_CORE_HOST
              value: "fortuna-core.fortuna.svc.cluster.local"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          # The stock nginx image starts as root and drops to the nginx user for workers.
          securityContext:
            allowPrivilegeEscalation: false
