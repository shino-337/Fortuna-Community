---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fortuna-agent
  namespace: fortuna
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fortuna
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortuna
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: fortuna-agent
      hostNetwork: false
      hostPID: false
      
      # Allow Agent to run on all nodes including master (if master has taints)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      
      volumes:
        # mTLS certificates
        - name: tls-certs
          secret:
            secretName: fortuna-agent-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: ca-cert
          secret:
            secretName: fortuna-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
        # Containerd socket
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
      
      containers:
        - name: agent
          # Use :latest after build (BUILD_TAG=latest). IfNotPresent: use local image when present; multi-node: push script loads on each node.
          image: fortuna-agent:latest
          imagePullPolicy: IfNotPresent
          
          env:
            # Core endpoints
            - name: CORE_GRPC_ENDPOINT
              value: "fortuna-core.fortuna.svc.cluster.local:9090"
            - name: CORE_HTTP_ENDPOINT
              value: "http://fortuna-core.fortuna.svc.cluster.local:8080"
            
            # Cluster: name is discovered from cluster (kubeadm-config, node labels, default API service, or cluster-<shortID>).
            # Optional override: set CLUSTER_ID/CLUSTER_NAME to force a specific id/name.
            # - name: CLUSTER_ID
            #   valueFrom:
            #     configMapKeyRef:
            #       name: fortuna-cluster-config
            #       key: cluster_id
            #       optional: true
            # - name: CLUSTER_NAME
            #   valueFrom:
            #     configMapKeyRef:
            #       name: fortuna-cluster-config
            #       key: cluster_name
            #       optional: true
            - name: SYNC_INTERVAL
              value: "5m"
            # Heartbeat interval (Ping to Core); default 15s so last_seen_at stays fresh for dashboard
            - name: HEARTBEAT_INTERVAL
              value: "15s"
            
            # Node info (AgentID defaults to NODE_NAME-agent in agent config if AGENT_ID unset)
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Optional: override agent id (default: NODE_NAME-agent, unique per node)
            # - name: AGENT_ID
            #   value: "my-agent-1"
            
            # mTLS Configuration
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_PATH
              value: "/etc/fortuna/certs/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/fortuna/certs/tls.key"
            - name: TLS_CA_CERT_PATH
              value: "/etc/fortuna/ca-cert/ca.crt"
            
            # Containerd config
            - name: CONTAINERD_SOCKET
              value: "/run/containerd/containerd.sock"
            - name: CONTAINERD_NAMESPACE
              value: "k8s.io"
            
            # Logging
            - name: LOG_LEVEL
              value: "info"
          
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/fortuna/certs
              readOnly: true
            - name: ca-cert
              mountPath: /etc/fortuna/ca-cert
              readOnly: true
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: true
          
          # Production-ready resource limits (SBOM extraction materializes image layers in memory; 1Gi was causing OOMKilled)
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          
          # Security context - root required for containerd socket access
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
