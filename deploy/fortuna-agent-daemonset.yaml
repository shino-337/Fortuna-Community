---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fortuna-agent
  namespace: fortuna
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fortuna
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortuna
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: fortuna-agent
      hostNetwork: false
      hostPID: false
      
      volumes:
        # mTLS certificates
        - name: fortuna-agent-client-tls
          secret:
            secretName: fortuna-agent-client-tls
        
        # Containerd socket (primary - for containerd runtime)
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
      
      containers:
        - name: agent
          # Production: Use versioned image tag
          # For local development: Use 'fortuna-agent:latest' with imagePullPolicy: Never
          # For production: Use 'fortuna-agent:v1.0.0' with imagePullPolicy: IfNotPresent
          image: fortuna-agent:latest
          # For local development: Never (use local image, don't pull from registry)
          # For production: IfNotPresent or Always
          imagePullPolicy: Never
          
          env:
            # Core gRPC endpoint
            - name: CORE_GRPC_ENDPOINT
              value: "fortuna-core.fortuna.svc.cluster.local:9090"
            
            # mTLS Configuration
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_PATH
              value: "/etc/fortuna/tls/client/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/fortuna/tls/client/tls.key"
            - name: TLS_CA_CERT_PATH
              value: "/etc/fortuna/tls/client/ca.crt"
            
            # Node info
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            
            # Agent config
            - name: AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_LEVEL
              value: "info"
            - name: BATCH_SIZE
              value: "50"
            - name: BATCH_TIMEOUT_MS
              value: "5000"
          
          volumeMounts:
            - name: fortuna-agent-client-tls
              mountPath: /etc/fortuna/tls/client
              readOnly: true
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: true
          
          # Production-ready resource limits
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
          
          # Security context - root required for docker socket access
          # This is a known security trade-off for DaemonSet workloads
          # Mitigations:
          # 1. Use dedicated service account with minimal privileges
          # 2. Run with only necessary capabilities
          # 3. Use read-only root filesystem where possible
          securityContext:
            privileged: false
            runAsNonRoot: false  # Required for docker socket access
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
