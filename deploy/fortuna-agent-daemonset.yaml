---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fortuna-agent
  namespace: fortuna
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fortuna
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortuna
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: fortuna-agent
      hostNetwork: false
      hostPID: false
      
      volumes:
        # mTLS certificates
        - name: fortuna-agent-client-tls
          secret:
            secretName: fortuna-agent-client-tls
        
        # Docker socket for SBOM extraction
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        
        # Containerd socket (alternative)
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
      
      containers:
        - name: agent
          image: fortuna-agent:latest
          imagePullPolicy: Never  # For local minikube
          
          env:
            # Core gRPC endpoint
            - name: CORE_GRPC_ENDPOINT
              value: "fortuna-core.fortuna.svc.cluster.local:9090"
            
            # mTLS Configuration
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_PATH
              value: "/etc/fortuna/tls/client/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/fortuna/tls/client/tls.key"
            - name: TLS_CA_CERT_PATH
              value: "/etc/fortuna/tls/client/ca.crt"
            
            # Node info
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            
            # Agent config
            - name: AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_LEVEL
              value: "info"
            - name: BATCH_SIZE
              value: "50"
            - name: BATCH_TIMEOUT_MS
              value: "5000"
          
          volumeMounts:
            - name: fortuna-agent-client-tls
              mountPath: /etc/fortuna/tls/client
              readOnly: true
            - name: docker-socket
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: true
          
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 2Gi
          
          securityContext:
            privileged: false
            runAsNonRoot: false  # Need root for docker socket access
            readOnlyRootFilesystem: true

