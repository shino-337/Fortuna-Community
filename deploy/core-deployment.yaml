apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortuna-core
  namespace: fortuna
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fortuna
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortuna
        app.kubernetes.io/component: core
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
      - name: core
        # Production: Use versioned tag (e.g., fortuna-core:v1.0.0)
        # Development: Use latest with imagePullPolicy: Never
        # Image should be built with: nerdctl build -f core/Dockerfile -t fortuna-core:latest --namespace k8s.io .
        image: fortuna-core:latest
        imagePullPolicy: Never  # For containerd local images. Change to IfNotPresent or Always for production registry
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: webhook
          containerPort: 8443
          protocol: TCP
        - name: grpc
          containerPort: 9090
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fortuna-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fortuna-secrets
              key: jwt-secret
        - name: HTTP_PORT
          value: "8080"
        - name: GRPC_PORT
          value: "9090"
        - name: AUTH_ENABLED
          value: "true"
        - name: FORTUNA_ADMIN_USERNAME
          value: "admin"
        - name: FORTUNA_ADMIN_PASSWORD
          value: "admin123"
        - name: FORTUNA_ADMIN_EMAIL
          value: "admin@fortuna.local"
        - name: NATS_ENDPOINT
          value: "nats://nats-client.fortuna.svc.cluster.local:4222"
        - name: TLS_ENABLED
          value: "true"
        - name: TLS_CA_CERT_PATH
          value: "/etc/fortuna/ca-cert/ca.crt"
        - name: TLS_CERT_PATH
          value: "/etc/fortuna/certs/tls.crt"
        - name: TLS_KEY_PATH
          value: "/etc/fortuna/certs/tls.key"
        - name: WEBHOOK_TLS_CERT_PATH
          value: "/etc/webhook/certs/tls.crt"
        - name: WEBHOOK_TLS_KEY_PATH
          value: "/etc/webhook/certs/tls.key"
        - name: FORTUNA_RULES_DIR
          value: "/root/rules"
        - name: FORTUNA_SBOM_ENABLED
          value: "true"
        - name: FORTUNA_SBOM_USE_CUSTOM
          value: "true"
        - name: FORTUNA_SBOM_MODE
          value: "async"
        - name: FORTUNA_CVE_SOURCE
          value: "postgres"
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/fortuna/certs
          readOnly: true
        - name: webhook-certs
          mountPath: /etc/webhook/certs
          readOnly: true
        - name: ca-cert
          mountPath: /etc/fortuna/ca-cert
          readOnly: true
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: tls-certs
        secret:
          secretName: fortuna-core-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: webhook-certs
        secret:
          secretName: fortuna-webhook-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: ca-cert
        secret:
          secretName: fortuna-ca-cert
          items:
          - key: ca.crt
            path: ca.crt
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
