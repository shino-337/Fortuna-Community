apiVersion: batch/v1
kind: CronJob
metadata:
  name: fortuna-risk-evaluation
  namespace: fortuna
  labels:
    app: fortuna-risk-evaluation
spec:
  # Run every 6 hours
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: fortuna-risk-evaluation
        spec:
          serviceAccountName: fortuna-core
          containers:
          - name: risk-evaluator
            image: curlimages/curl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting risk evaluation at $(date)"
              
              # Get Core service endpoint
              # NOTE: Uses fortuna-core service name as defined in fortuna-core-deployment.yaml
              CORE_SERVICE="${CORE_SERVICE_URL:-http://fortuna-core.fortuna.svc.cluster.local:8080}"
              
              # Login to get token
              # WARNING: For production, replace hardcoded credentials with Kubernetes Secret references.
              # Use: kubectl create secret generic fortuna-admin-creds --from-literal=username=admin --from-literal=password=<secure-password>
              echo "Authenticating..."
              ADMIN_USER="${ADMIN_USERNAME:-admin}"
              ADMIN_PASS="${ADMIN_PASSWORD:-admin123}"
              TOKEN=$(curl -s -X POST ${CORE_SERVICE}/api/v1/auth/login \
                -H "Content-Type: application/json" \
                -d "{\"username\":\"${ADMIN_USER}\",\"password\":\"${ADMIN_PASS}\"}" \
                | grep -o '"token":"[^"]*' | cut -d'"' -f4)
              
              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to get authentication token"
                exit 1
              fi
              
              echo "Token obtained, triggering risk evaluation..."
              
              # Trigger historical risk evaluation (uses Risk Worker engine)
              RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
                ${CORE_SERVICE}/api/v1/insights/evaluate/historical \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${TOKEN}")
              
              HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
              BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE:/d')
              
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Risk evaluation completed successfully"
                echo "Response: $BODY"
                exit 0
              else
                echo "❌ Risk evaluation failed with HTTP code: $HTTP_CODE"
                echo "Response: $BODY"
                exit 1
              fi
            env:
            # Override these with secretKeyRef in production
            # Example:
            #   - name: ADMIN_USERNAME
            #     valueFrom:
            #       secretKeyRef:
            #         name: fortuna-admin-creds
            #         key: username
            #   - name: ADMIN_PASSWORD
            #     valueFrom:
            #       secretKeyRef:
            #         name: fortuna-admin-creds
            #         key: password
            - name: CORE_SERVICE_URL
              value: "http://fortuna-core.fortuna.svc.cluster.local:8080"
            resources:
              requests:
                memory: "32Mi"
                cpu: "50m"
              limits:
                memory: "64Mi"
                cpu: "100m"
          restartPolicy: OnFailure

