apiVersion: batch/v1
kind: CronJob
metadata:
  name: fortuna-risk-evaluation
  namespace: fortuna
  labels:
    app: fortuna-risk-evaluation
spec:
  # Run every 6 hours
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: fortuna-risk-evaluation
        spec:
          serviceAccountName: fortuna-core
          containers:
          - name: risk-evaluator
            image: curlimages/curl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting risk evaluation at $(date)"
              
              # Get Core service endpoint
              CORE_SERVICE="http://core.fortuna.svc.cluster.local:8080"
              
              # Login to get token
              echo "Authenticating..."
              TOKEN=$(curl -s -X POST ${CORE_SERVICE}/api/v1/auth/login \
                -H "Content-Type: application/json" \
                -d '{"username":"admin","password":"admin123"}' \
                | grep -o '"token":"[^"]*' | cut -d'"' -f4)
              
              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to get authentication token"
                exit 1
              fi
              
              echo "Token obtained, triggering risk evaluation..."
              
              # Trigger historical risk evaluation (uses Risk Worker engine)
              RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
                ${CORE_SERVICE}/api/v1/insights/evaluate/historical \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${TOKEN}")
              
              HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
              BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE:/d')
              
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Risk evaluation completed successfully"
                echo "Response: $BODY"
                exit 0
              else
                echo "❌ Risk evaluation failed with HTTP code: $HTTP_CODE"
                echo "Response: $BODY"
                exit 1
              fi
            resources:
              requests:
                memory: "32Mi"
                cpu: "50m"
              limits:
                memory: "64Mi"
                cpu: "100m"
          restartPolicy: OnFailure

