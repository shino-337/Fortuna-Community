apiVersion: v1
kind: Service
metadata:
  name: fortuna-core-external
  namespace: fortuna
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
