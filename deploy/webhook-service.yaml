apiVersion: v1
kind: Service
metadata:
  name: fortuna-webhook
  namespace: fortuna
  labels:
    app: fortuna-core
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: webhook
  selector:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core

