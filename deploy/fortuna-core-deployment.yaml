---
apiVersion: v1
kind: Service
metadata:
  name: fortuna-core
  namespace: fortuna
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
spec:
  selector:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortuna-core
  namespace: fortuna
  labels:
    app.kubernetes.io/name: fortuna
    app.kubernetes.io/component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fortuna
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortuna
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: fortuna-core
      
      volumes:
        # mTLS certificates
        - name: fortuna-core-server-tls
          secret:
            secretName: fortuna-core-server-tls
      
      containers:
        - name: core
          # Production: Use versioned image tag
          # For minikube/local: Use 'fortuna-core:latest' with imagePullPolicy: Never
          # For production: Use 'fortuna-core:v1.0.0' with imagePullPolicy: IfNotPresent
          image: fortuna-core:latest
          # For local development (minikube): Never
          # For production: IfNotPresent or Always
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          
          env:
            # Database
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres.fortuna.svc.cluster.local:5432/ksam?sslmode=disable"
            
            # NATS
            - name: NATS_ENDPOINT
              value: "nats://nats.fortuna.svc.cluster.local:4222"
            
            # Ports
            - name: HTTP_PORT
              value: "8080"
            - name: GRPC_PORT
              value: "9090"
            
            # mTLS Configuration
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_PATH
              value: "/etc/fortuna/tls/server/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/fortuna/tls/server/tls.key"
            - name: TLS_CA_CERT_PATH
              value: "/etc/fortuna/tls/server/ca.crt"
            
            # Logging
            - name: LOG_LEVEL
              value: "info"
            
            # Auth (optional)
            - name: AUTH_ENABLED
              value: "false"
          
          volumeMounts:
            - name: fortuna-core-server-tls
              mountPath: /etc/fortuna/tls/server
              readOnly: true
          
          # Production-ready resource limits
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          
          # Security context - non-root user
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Core needs to write logs and temp files
            capabilities:
              drop:
                - ALL
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
