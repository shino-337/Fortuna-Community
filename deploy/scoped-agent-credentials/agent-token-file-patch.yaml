apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fortuna-agent
  namespace: fortuna
spec:
  template:
    spec:
      volumes:
        - name: agent-http-credential
          hostPath:
            # Provision a distinct token on every node before applying this patch.
            path: /etc/fortuna/agent-credentials/token
            type: File
      containers:
        - name: agent
          env:
            - name: FORTUNA_AGENT_TOKEN_FILE
              value: /etc/fortuna/agent-credentials/token
            # The token file covers both Agent HTTP and runtime v2 requests.
            # Scoped mode never falls back to the shared base token.
          volumeMounts:
            - name: agent-http-credential
              mountPath: /etc/fortuna/agent-credentials/token
              readOnly: true
