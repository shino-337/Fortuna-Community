# fortuna-secrets: JWT, DB URL, NVD API key, etc.
# Created automatically by: ./scripts/utils/ensure-fortuna-secrets.sh
# For NVD API key: put NVD_API_KEY in deploy/secrets.env (copy from deploy/secrets.env.example) then re-run the script.
apiVersion: v1
kind: Secret
metadata:
  name: fortuna-secrets
  namespace: fortuna
type: Opaque
stringData:
  database-url: "postgres://postgres:postgres@postgres.fortuna.svc.cluster.local:5432/fortuna?sslmode=disable"
  jwt-secret: "fortuna-jwt-secret-change-in-production"
  # nvd-api-key: added by scripts/utils/ensure-fortuna-secrets.sh from deploy/secrets.env or env NVD_API_KEY
