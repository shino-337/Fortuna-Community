# Production docker-compose configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: '3.8'

services:
  core:
    image: fortuna-core:latest  # Use production image
    build:  # Remove build section for production
    environment:
      LOG_LEVEL: "info"
      TLS_ENABLED: "true"
      # Add production TLS paths if using mounted certs
      # TLS_CERT_PATH: /etc/fortuna/tls/server/tls.crt
      # TLS_KEY_PATH: /etc/fortuna/tls/server/tls.key
      # TLS_CA_CERT_PATH: /etc/fortuna/tls/server/ca.crt
    volumes:
      # Mount TLS certificates in production
      # - ./certs:/etc/fortuna/tls/server:ro
      - /app/bin
    restart: always

  agent:
    image: fortuna-agent:latest  # Use production image
    build:  # Remove build section for production
    environment:
      LOG_LEVEL: "info"
      TLS_ENABLED: "true"
      # Add production TLS paths if using mounted certs
      # TLS_CERT_PATH: /etc/fortuna/tls/client/tls.crt
      # TLS_KEY_PATH: /etc/fortuna/tls/client/tls.key
      # TLS_CA_CERT_PATH: /etc/fortuna/tls/client/ca.crt
    volumes:
      # Mount TLS certificates in production
      # - ./certs:/etc/fortuna/tls/client:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /app/bin
    restart: always

  postgres:
    restart: always
    # Add backup volumes in production
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    #   - ./backups:/backups

  nats:
    restart: always
